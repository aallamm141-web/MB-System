<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MB</title>
<meta name="theme-color" content="#050912"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="MB"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="format-detection" content="telephone=no">
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e3e6ea;--ac:#e11d48;--br:#1f6feb;--ok:#16a34a;--wn:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--cd:#181b21;--tx:#eef0f3;--mu:#98a0ab;--bd:#2a2f38}}
:root[data-theme="dark"]{--bg:#0f1115;--cd:#181b21;--tx:#eef0f3;--mu:#98a0ab;--bd:#2a2f38}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--cd);border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:0;z-index:30}
header .lg{width:38px;height:38px;border-radius:50%;flex:0 0 auto}
header h1{font-size:20px;margin:0 0 0 8px;letter-spacing:1px}nav{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:thin;padding-bottom:2px}nav button{flex:0 0 auto;white-space:nowrap}
button{font:inherit;padding:7px 12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;cursor:pointer}
button.on,button.pri{background:var(--br);border-color:var(--br);color:#fff}
main{padding:clamp(8px,1.6vw,22px);width:100%;max-width:none;margin:0}
.g2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:12px}@media(max-width:900px){.g2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin:4px 0 8px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.ln small,.mu{display:block;color:var(--mu);font-size:12px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:8px;text-align:right;border-bottom:1px solid var(--bd)}
.bad{color:var(--ac)}.warn{color:var(--wn)}.ok{color:var(--ok)}s{color:var(--mu)}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);width:min(520px,94vw);max-height:92vh;overflow:auto}
*{-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%}button,label{touch-action:manipulation}
.btnl{display:inline-block;padding:7px 12px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;color:var(--tx);background:var(--cd);margin:0;font-size:inherit;text-align:center}
#cartbar{display:none}
#updbar{background:var(--br);color:#fff;padding:8px 14px;text-align:center;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}#updbar button{background:#fff;color:var(--br);border:0;font-weight:700}#updbar button.ghost{background:transparent;color:#fff;border:1px solid #fff9}#updbadge{background:var(--br);color:#fff;border:0;border-radius:99px;padding:4px 12px;font-size:.85em;font-weight:700;cursor:pointer}
.rc .rl{width:96px;height:96px;display:block;margin:0 auto 2px}
@media(min-width:901px){.pos>.card:last-child{position:sticky;top:72px;align-self:start;max-height:calc(100vh - 88px);overflow:auto}}
@media(min-width:1400px){body{font-size:16px}}
@media(max-width:900px){header nav{order:3;flex:1 0 100%}#cartbar{display:block;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--br);color:#fff;text-align:center;padding:12px;border-radius:12px;font-weight:700;box-shadow:0 4px 16px #0006;cursor:pointer}main{padding-bottom:84px}}
@media(max-width:700px){input,select,textarea{font-size:16px}button{min-height:40px}.kpi{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}th,td{padding:6px}}
.row{display:flex;gap:8px}.row>*{flex:1}label{display:block;font-size:13px;color:var(--mu)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}.kpi b{display:block;font-size:20px}
#rcpt{display:none}
.chip{display:inline-block;font-size:11px;padding:0 7px;border-radius:99px;margin:3px 0 0 4px;border:1px solid currentColor}
.chip.warn{color:var(--wn)}.chip.bad{color:var(--ac)}
@keyframes fl{from{background:rgba(22,163,74,.38)}to{background:transparent}}.fl{animation:fl .8s ease-out}
.kb{font-size:11px;color:var(--mu);margin:-2px 0 6px}
.chg{font-size:22px;margin:8px 0;min-height:30px}.chg b{display:block}
.qk{flex-wrap:wrap}.qk button{flex:1 0 auto}
#toast{display:none;position:fixed;inset:auto auto calc(16px + env(safe-area-inset-bottom,0px)) 50%;transform:translateX(-50%);margin:0;border:0;max-width:92vw;padding:10px 18px;border-radius:12px;color:#fff;font-weight:600;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.3);pointer-events:none;z-index:99}
#toast:popover-open,#toast.show{display:block}
#toast.ok{background:#16a34a}#toast.warn{background:#d97706}#toast.bad{background:#e11d48}
.rc{background:#fff;color:#000;width:300px;max-width:100%;margin:0 auto;padding:10px;font:12px/1.5 monospace;direction:rtl}
.rc h2{text-align:center;margin:0 0 4px;font-size:16px;color:#000}.rc .c{text-align:center}.rc .b{font-weight:700}
.rc table{width:100%;border-collapse:collapse}.rc th,.rc td{padding:1px 2px;text-align:right;border:0;background:none;color:#000;font-size:12px}
.rc hr{border:0;border-top:1px dashed #000;margin:6px 0}.rc .t{display:flex;justify-content:space-between;gap:8px}.rc .hd{display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid #000;padding-bottom:2px}.rc .it{padding:3px 0;border-bottom:1px dotted #888}.rc .in{font-weight:700;word-break:break-word}.rc .iv{display:flex;justify-content:space-between;gap:8px}.rc bdi{unicode-bidi:isolate}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block!important}@page{size:80mm auto;margin:2mm}}
</style></head><body>

<div id="updbar" style="display:none"></div>

const kst=(m='readonly')=>DB.transaction('k',m).objectStore('k');
const snapMetas=()=>new Promise(r=>{try{const q=kst().getAll(IDBKeyRange.bound('snapm:','snapm:\uffff'),400);q.onsuccess=()=>r(q.result.sort((a,b)=>b.id.localeCompare(a.id)));q.onerror=()=>r([])}catch(e){r([])}});

async function snap(label){if(!DB||!(S.s.length||S.p.length))return;try{const id=new Date().toISOString(),json=JSON.stringify(S),os=DB.transaction('k','readwrite').objectStore('k');snapBig=json.length>3e6;lastSnap=Date.now();
  os.put(json,'snap:'+id);os.put({id,label,s:S.s.length,p:S.p.length,kb:Math.round(json.length/1024)},'snapm:'+id);
  await new Promise(r=>{os.transaction.oncomplete=r;os.transaction.onerror=os.transaction.onabort=r});await snapPrune()}catch(e){}}
async function snapPrune(){const L=await snapMetas(),keep=new Set(),days=new Set();
  L.slice(0,24).forEach(m=>keep.add(m.id));
  for(const m of L){const d=cairo(m.id);if(!days.has(d)&&days.size<14){days.add(d);keep.add(m.id)}}
  let tot=0,n=0;const L2=L.filter(m=>keep.has(m.id));for(const m of L2){tot+=m.kb||0;if(++n>6&&tot>204800)keep.delete(m.id)}
  const o=DB.transaction('k','readwrite').objectStore('k');for(const m of L)if(!keep.has(m.id)){o.delete('snap:'+m.id);o.delete('snapm:'+m.id)}}
