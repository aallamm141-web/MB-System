name: Release Windows installer
# Push a tag like v1.0.1 (same number as "version" in package.json) and this builds the installer
# and publishes a GitHub Release with MB-Store-Setup-x.y.z.exe + latest.yml (what the app checks for updates).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Tell the build which GitHub repo the updates come from
        run: npm pkg set repository.type=git repository.url=https://github.com/${{ github.repository }}.git
      - name: Build and publish the release
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
