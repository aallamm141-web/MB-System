name: Release Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار الجديد (مثال 1.0.3 - من غير v)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Set version (from tag or manual input)
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $v = '${{ inputs.version }}' } else { $v = '${{ github.ref_name }}' }
          $v = $v.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Bad version: $v" }
          npm version $v --no-git-tag-version --allow-same-version
      - name: Create the tag (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'.Trim().TrimStart('v')
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag "v$v"
          git push origin "v$v"
      - name: Tell the build which GitHub repo the updates come from
        run: npm pkg set repository.type=git repository.url=https://github.com/${{ github.repository }}.git
      - name: Build and publish the release
        run: npx electron-builder --win nsis --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
